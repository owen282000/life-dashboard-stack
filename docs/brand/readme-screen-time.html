<!DOCTYPE html>
<!--
  Source for docs/readme-screen-time.png, the second image in the README: the Screen time
  dashboard filled with the demo profile's sample data, in the same card as the README images
  of the Android app. Drawn at twice the size it is shown at (900 px wide).

  The screenshot is docs/screenshots/readme/screen-time.png (3200 x 2732): Grafana in kiosk mode,
  dark theme, Phone demo-android, the default range of 30 days, 1600 CSS px wide at device scale
  2, with Grafana's footer cut off. Take a new one, set .shot's height to 1704 / its width x
  its height, and render again:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --screenshot=docs/readme-screen-time.png --window-size=1800,1551 \
      --hide-scrollbars --force-device-scale-factor=1 \
      --default-background-color=00000000 docs/brand/readme-screen-time.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1800px; height: 1551px; overflow: hidden; background: transparent; }
  .card {
    position: absolute; inset: 0; border-radius: 40px; overflow: hidden;
    background: radial-gradient(130% 130% at 25% 20%, #171D21 0%, #14181C 45%, #101C1C 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: 0.5;
    background-image:
      linear-gradient(rgba(48,183,126,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(48,183,126,0.05) 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .shot {
    position: absolute; left: 48px; top: 48px; width: 1704px; height: 1455px;
    border-radius: 24px; overflow: hidden;
    border: 3px solid rgba(255,255,255,0.12);
    box-shadow: 0 24px 60px rgba(0,0,0,0.45), 0 0 0 10px rgba(255,255,255,0.025);
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="shot"><img src="../screenshots/readme/screen-time.png" alt=""></div>
</div>
</body>
</html>
