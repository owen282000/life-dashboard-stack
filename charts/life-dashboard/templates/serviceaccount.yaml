{{- if .Values.serviceAccount.create }}
# One account for the stack's pods. They never talk to the Kubernetes API, so no token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "life-dashboard.serviceAccountName" . }}
  labels:
    {{- include "life-dashboard.labels" (list . "stack") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
