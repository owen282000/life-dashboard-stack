{{- include "life-dashboard.validate" . -}}
{{- $root := . -}}
{{- $all := include "life-dashboard.secretData" . | fromJson }}
{{- range $name := keys $all | sortAlpha }}
{{- $data := get $all $name }}
{{- $role := hasKey $data "username" }}
---
{{- if $role }}
# The password of {{ get $data "username" }}, which CloudNativePG sets on the role (managed roles).
{{- else }}
# The stack's secrets, generated once and kept on upgrades (lookup), or taken from values.
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "life-dashboard.labels" (list $root "secrets") | nindent 4 }}
    {{- if $role }}
    cnpg.io/reload: "true"
    {{- end }}
  {{- if $root.Values.secrets.keepOnUninstall }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
type: {{ ternary "kubernetes.io/basic-auth" "Opaque" $role }}
data:
  {{- range $key := keys $data | sortAlpha }}
  {{ $key }}: {{ get $data $key | b64enc | quote }}
  {{- end }}
{{- end }}
