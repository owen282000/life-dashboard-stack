apiVersion: v2
name: life-dashboard
description: >-
  Your phone's health data and screen time in your own cluster: the backend for the Life
  Dashboard Companion apps for Android (Health Connect) and iPhone (Apple Health). A receiver,
  Postgres (CloudNativePG, a bundled StatefulSet or your own), Grafana with six dashboards,
  and an optional read-only MCP server for the AI you choose.
type: application
# One version for the whole stack: the chart, the four images it runs and docker-compose.yml
# all carry the release version. scripts/prepare-release.sh sets these two lines and the
# images in artifacthub.io/images below, and a release tag must equal them.
version: 1.1.2
appVersion: "1.1.2"
kubeVersion: ">=1.29.0-0"
home: https://github.com/owen282000/life-dashboard-stack
sources:
  - https://github.com/owen282000/life-dashboard-stack
icon: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/brand/icon.png
keywords:
  - health
  - screen-time
  - grafana
  - postgres
  - cloudnative-pg
  - self-hosted
maintainers:
  - name: owen282000
    url: https://github.com/owen282000
# For Artifact Hub (artifacthub.io/docs/topics/annotations/helm). scripts/prepare-release.sh
# writes the first two from the version's changelog section. The images are listed by hand:
# Artifact Hub would otherwise take them from a dry run with the default values, which leave
# out the MCP server.
annotations:
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: "The pairing block, in the receiver's log, from `python pairing.py` and from the installer, names the `/pair` page by its full address, such as `http://192.168.1.10:8080/pair?label=<label>`, built from `PUBLIC_URL`, and says when it needs `&token=`. With `PAIRING_PAGE=0`, as on Kubernetes by default and under a rootless engine, it points to `python pairing.py <label>` instead. The installer's summary lists the page under **Pairing**."
    - kind: fixed
      description: "The apps' pairing test now reports the stack as confirmed. The iPhone app said \"Delivered, but the Life Dashboard integration did not answer\" after pairing with the stack, because it counts a test ping as confirmed only when the answer names the request's signature, as the Home Assistant integration's answer does. With `WEBHOOK_SECRET` set, the receiver now answers every payload it takes with `life_dashboard` (`receiver` and `version`) and `writeback.in_reply_to`, signed with a key derived from the secret, in the same way. It announces no write-back protocol, so the apps still take no measurements from it, and a refusal or a receiver without a secret answers as before. docs/compatibility.md has the format."
  artifacthub.io/license: MIT
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: receiver
      image: ghcr.io/owen282000/life-dashboard-receiver:1.1.2
      platforms: [linux/amd64, linux/arm64]
    - name: grafana
      image: ghcr.io/owen282000/life-dashboard-grafana:1.1.2
      platforms: [linux/amd64, linux/arm64]
    - name: db
      image: ghcr.io/owen282000/life-dashboard-db:1.1.2
      platforms: [linux/amd64, linux/arm64]
    - name: mcp
      image: ghcr.io/owen282000/life-dashboard-mcp:1.1.2
      platforms: [linux/amd64, linux/arm64]
  artifacthub.io/links: |
    - name: Android app
      url: https://github.com/owen282000/life-dashboard-companion-app
    - name: iPhone app
      url: https://github.com/owen282000/life-dashboard-companion-app-ios
    - name: Home Assistant integration
      url: https://github.com/owen282000/life-dashboard-ha
    - name: Website
      url: https://owen282000.com/life-dashboard/grafana/
    - name: Kubernetes guide
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/docs/kubernetes.md
    - name: Changelog
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/CHANGELOG.md
    - name: MCP server
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/docs/mcp.md
    - name: support
      url: https://github.com/owen282000/life-dashboard-stack/issues
  artifacthub.io/screenshots: |
    - title: Overview
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/overview.png
    - title: Activity
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/activity.png
    - title: Sleep
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/sleep.png
    - title: Heart and body
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/heart-body.png
    - title: Screen time
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/screen-time.png
    - title: Data and sync
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/data.png
