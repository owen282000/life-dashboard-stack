apiVersion: v2
name: life-dashboard
description: >-
  Your phone's health data and screen time in your own cluster: the backend for the Life
  Dashboard Companion apps for Android (Health Connect) and iPhone (Apple Health). A receiver,
  Postgres (CloudNativePG, a bundled StatefulSet or your own), Grafana with six dashboards,
  and an optional read-only MCP server for the AI you choose.
type: application
# One version for the whole stack: the chart, the four images it runs and docker-compose.yml
# all carry the release version. scripts/prepare-release.sh sets these two lines and the
# images in artifacthub.io/images below, and a release tag must equal them.
version: 1.1.1
appVersion: "1.1.1"
kubeVersion: ">=1.29.0-0"
home: https://github.com/owen282000/life-dashboard-stack
sources:
  - https://github.com/owen282000/life-dashboard-stack
icon: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/brand/icon.png
keywords:
  - health
  - screen-time
  - grafana
  - postgres
  - cloudnative-pg
  - self-hosted
maintainers:
  - name: owen282000
    url: https://github.com/owen282000
# For Artifact Hub (artifacthub.io/docs/topics/annotations/helm). scripts/prepare-release.sh
# writes the first two from the version's changelog section. The images are listed by hand:
# Artifact Hub would otherwise take them from a dry run with the default values, which leave
# out the MCP server.
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: "The receiver and MCP server images are built on Alpine (`python:3.14.8-alpine`) instead of Debian (`python:3.14.8-slim`), and no longer carry pip. Trivy found 48 high-severity vulnerabilities in each 1.1.0 image: 44 in Debian packages the stack never uses, such as util-linux, with no fix available, and 4 in the packages pip bundles, such as urllib3. In the new images it finds none, of any severity, and the download shrinks from 54 to 28 MB for the receiver and from 67 to 42 MB for the MCP server. Python, the commands such as `python pairing.py` and `python doctor.py`, and the healthchecks stay the same; a shell in these containers is `sh`, not `bash`."
    - kind: security
      description: "The Grafana image drops the data source plugins that Grafana bundles and the stack does not use (Prometheus, Loki, Tempo, Jaeger, Zipkin, Pyroscope, Elasticsearch, InfluxDB, MySQL, Microsoft SQL Server, OpenTSDB and Google Cloud Monitoring), which removes 52 of its 60 known high vulnerabilities. The 8 left are in Grafana itself and in its PostgreSQL plugin, and go with a Grafana update. Added one of those data sources by hand? Another data source in Grafana says how to get it back."
    - kind: security
      description: "The db image drops the official Postgres image's `gosu`, built with an old Go and the source of all its 25 known critical and high vulnerabilities, for Alpine's `su-exec`. The image now has none, and starts as before."
    - kind: changed
      description: "On Artifact Hub, the chart starts with the phone: its description and README name the Android and iPhone apps first, with where to get them and the How it works diagram, and its links list the apps and the Home Assistant integration."
  artifacthub.io/license: MIT
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: receiver
      image: ghcr.io/owen282000/life-dashboard-receiver:1.1.1
      platforms: [linux/amd64, linux/arm64]
    - name: grafana
      image: ghcr.io/owen282000/life-dashboard-grafana:1.1.1
      platforms: [linux/amd64, linux/arm64]
    - name: db
      image: ghcr.io/owen282000/life-dashboard-db:1.1.1
      platforms: [linux/amd64, linux/arm64]
    - name: mcp
      image: ghcr.io/owen282000/life-dashboard-mcp:1.1.1
      platforms: [linux/amd64, linux/arm64]
  artifacthub.io/links: |
    - name: Android app
      url: https://github.com/owen282000/life-dashboard-companion-app
    - name: iPhone app
      url: https://github.com/owen282000/life-dashboard-companion-app-ios
    - name: Home Assistant integration
      url: https://github.com/owen282000/life-dashboard-ha
    - name: Website
      url: https://owen282000.com/life-dashboard/grafana/
    - name: Kubernetes guide
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/docs/kubernetes.md
    - name: Changelog
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/CHANGELOG.md
    - name: MCP server
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/docs/mcp.md
    - name: support
      url: https://github.com/owen282000/life-dashboard-stack/issues
  artifacthub.io/screenshots: |
    - title: Overview
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/overview.png
    - title: Activity
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/activity.png
    - title: Sleep
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/sleep.png
    - title: Heart and body
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/heart-body.png
    - title: Screen time
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/screen-time.png
    - title: Data and sync
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/data.png
