apiVersion: v2
name: life-dashboard
description: >-
  Your phone's health data and screen time in your own cluster: the backend for the Life
  Dashboard Companion apps for Android (Health Connect) and iPhone (Apple Health). A receiver,
  Postgres (CloudNativePG, a bundled StatefulSet or your own), Grafana with six dashboards,
  and an optional read-only MCP server for the AI you choose.
type: application
# One version for the whole stack: the chart, the four images it runs and docker-compose.yml
# all carry the release version. scripts/prepare-release.sh sets these two lines and the
# images in artifacthub.io/images below, and a release tag must equal them.
version: 1.2.0
appVersion: "1.2.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/owen282000/life-dashboard-stack
sources:
  - https://github.com/owen282000/life-dashboard-stack
icon: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/brand/icon.png
keywords:
  - health
  - screen-time
  - grafana
  - postgres
  - cloudnative-pg
  - self-hosted
maintainers:
  - name: owen282000
    url: https://github.com/owen282000
# For Artifact Hub (artifacthub.io/docs/topics/annotations/helm). scripts/prepare-release.sh
# writes the first two from the version's changelog section. The images are listed by hand:
# Artifact Hub would otherwise take them from a dry run with the default values, which leave
# out the MCP server.
annotations:
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/changes: |
    - kind: security
      description: "A new stack is no longer open by default. A `docker compose up` without `install.sh` used to start a receiver that stored unsigned payloads from anyone who could reach it, with a Grafana `admin` password of `lifedash` and the read-only database roles on `lifedash-ro` and `lifedash-dash-ro`, all on every network interface. Now a new install, meaning a database the receiver never set up and an empty Grafana volume, starts only with `WEBHOOK_SECRET` set and with `GRAFANA_PASSWORD`, `GRAFANA_DB_PASSWORD` and `DASH_DB_PASSWORD` of your own. Until then the receiver and Grafana stop with a line in their log that names the setting. `install.sh` and the Helm chart already set all of them, so nothing changes there."
    - kind: security
      description: "A stack that already has its data starts as before, with the `.env` it has, as docs/compatibility.md promises for 1.x. Without a secret it keeps storing unsigned payloads and saying so at every start; `doctor` reports that as a failure and an old default password as a warning."
    - kind: security
      description: "`ALLOW_UNSIGNED=1` is the way to start a new stack without a secret on purpose. `.env.example` no longer carries the old passwords, and says how to keep Grafana or the MCP server on the machine itself (`GRAFANA_PORT=127.0.0.1:3000`). The receiver stays on every interface, since the phones reach it over your network."
    - kind: security
      description: "The demo in the README and in docs/install.md writes a `.env` with its own secret and passwords first; its Grafana password is `demo-admin`."
  artifacthub.io/license: MIT
  artifacthub.io/category: monitoring-logging
  artifacthub.io/images: |
    - name: receiver
      image: ghcr.io/owen282000/life-dashboard-receiver:1.2.0
      platforms: [linux/amd64, linux/arm64]
    - name: grafana
      image: ghcr.io/owen282000/life-dashboard-grafana:1.2.0
      platforms: [linux/amd64, linux/arm64]
    - name: db
      image: ghcr.io/owen282000/life-dashboard-db:1.2.0
      platforms: [linux/amd64, linux/arm64]
    - name: mcp
      image: ghcr.io/owen282000/life-dashboard-mcp:1.2.0
      platforms: [linux/amd64, linux/arm64]
  artifacthub.io/links: |
    - name: Android app
      url: https://github.com/owen282000/life-dashboard-companion-app
    - name: iPhone app
      url: https://github.com/owen282000/life-dashboard-companion-app-ios
    - name: Home Assistant integration
      url: https://github.com/owen282000/life-dashboard-ha
    - name: Website
      url: https://owen282000.com/life-dashboard/grafana/
    - name: Kubernetes guide
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/docs/kubernetes.md
    - name: Changelog
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/CHANGELOG.md
    - name: MCP server
      url: https://github.com/owen282000/life-dashboard-stack/blob/main/docs/mcp.md
    - name: support
      url: https://github.com/owen282000/life-dashboard-stack/issues
  artifacthub.io/screenshots: |
    - title: Overview
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/overview.png
    - title: Activity
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/activity.png
    - title: Sleep
      url: https://raw.githubusercontent.com/owen282000/life-dashboard-stack/main/docs/screenshots/sleep.png
    - title: Heart and body
