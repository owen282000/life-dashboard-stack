apiVersion: 1
datasources:
  - name: LifeDashboard Postgres
    uid: lifedash-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro
    isDefault: true
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: lifedash
      sslmode: disable
      postgresVersion: 1500
      timeInterval: 1m
