version: 2
updates:
  # Keeps the SHA-pinned workflow actions up to date (pins never move on their own)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The repo's commit style, "build(deps): Bump ...", set rather than guessed from history
    commit-message:
      prefix: "build"
      include: "scope"

  # The receiver image's Python base image
  - package-ecosystem: "docker"
    directory: "/receiver"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  # The Grafana image's base image, which sets the Grafana version
  - package-ecosystem: "docker"
    directory: "/grafana"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  # The db image's Postgres; the tests start their Postgres from the same line
  - package-ecosystem: "docker"
    directory: "/db"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      # A Postgres major cannot open the previous major's data directory; it needs
      # tools/upgrade-postgres.sh, so majors are upgraded by hand.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The MCP server image's Python base image
  - package-ecosystem: "docker"
    directory: "/mcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  # The pinned packages of the receiver and the MCP server, and pytest for their tests. One group,
  # because the tests install both requirements files together and they share pins such as pytest
  # and psycopg: one bump per directory can never pass on its own.
  - package-ecosystem: "pip"
    directories:
      - "/receiver"
      - "/mcp"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python-packages:
        patterns:
          - "*"
