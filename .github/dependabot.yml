version: 2
updates:
  # The base images of the three published images: python, grafana/grafana and postgres.
  - package-ecosystem: docker
    directories: ["/receiver", "/grafana", "/db"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    ignore:
      # A Postgres major cannot open the previous major's data directory; it needs
      # tools/upgrade-postgres.sh, so majors are upgraded by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /receiver
    schedule:
      interval: weekly
    groups:
      pip:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
