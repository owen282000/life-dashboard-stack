name: release

# A version tag (1.2.3, no prefix) publishes the receiver, grafana, db and mcp images to GHCR
# for amd64 and arm64, tagged 1.2.3, 1.2, 1 and latest, with build provenance and an SBOM.
# It packages the Helm chart in charts/life-dashboard and pushes it to
# oci://ghcr.io/owen282000/charts/life-dashboard as version 1.2.3, with an attestation, and
# charts/artifacthub-repo.yml to its tag artifacthub.io for Artifact Hub. Then
# it creates the GitHub release with docker-compose.yml, env.example and install.sh attached and
# the version's section of CHANGELOG.md as the notes, followed by where to get the images and the
# chart. With the MCP image on GHCR, it publishes server.json, the MCP server's entry, to the
# official MCP Registry (registry.modelcontextprotocol.io) as io.github.owen282000/life-dashboard.
# Everything carries the one version of the tag: scripts/prepare-release.sh points the compose
# file, install.sh, the chart's version, appVersion and images, server.json and mcp/server.py at
# it, and the check job refuses a tag that does not match them.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

env:
  TAG: ${{ github.ref_name }}
  HELM_VERSION: v4.3.0

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag, the chart, docker-compose.yml, server.json and CHANGELOG.md agree on the version
        run: .github/scripts/check-release.sh "$TAG"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: The chart lints, and its version is not on GHCR yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helm lint --strict charts/life-dashboard
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if helm show chart oci://ghcr.io/owen282000/charts/life-dashboard --version "$TAG" > /dev/null 2>&1; then
            echo "::error::chart version $TAG is already on GHCR"
            exit 1
          fi
      - run: .github/scripts/release-notes.sh "$TAG"

  images:
    name: Publish ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: receiver
            title: Life Dashboard receiver
            description: Takes signed payloads from the Life Dashboard Companion apps and stores them in Postgres
          - image: grafana
            title: Life Dashboard Grafana
            description: Grafana with the six Life Dashboard dashboards and the Postgres data source provisioned
          - image: db
            title: Life Dashboard database
            description: Postgres for the Life Dashboard Stack, with a guard for data left in a Postgres 16 volume
          - image: mcp
            title: Life Dashboard MCP server
            description: Read-only MCP server that lets a model of your choice read the Life Dashboard views
    env:
      IMAGE: ghcr.io/owen282000/life-dashboard-${{ matrix.image }}
      # GHCR shows the description of a multi-arch image from the index annotation.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=true
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          # A release builds from scratch, so the apk upgrade and the base image's newest
          # patches go in, not a layer cached by an earlier pull request. It still fills the
          # cache for the test workflow.
          no-cache: true
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # A signed GitHub attestation as well, checked with: gh attestation verify oci://<image> -R owen282000/life-dashboard-stack
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  chart:
    name: Publish the Helm chart
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REPOSITORY: ghcr.io/owen282000/charts
      ORAS_VERSION: 1.3.4
      ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      # helm registry login below is for helm push; the attestation step pushes with Docker's
      # credentials, which only this login writes.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Package and push the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The check job made sure Chart.yaml says $TAG; the flags only make it explicit.
          helm package charts/life-dashboard --version "$TAG" --app-version "$TAG" --destination dist
          helm push "dist/life-dashboard-$TAG.tgz" "oci://$REPOSITORY" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -n 1)
          [ -n "$digest" ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Checked with: gh attestation verify oci://ghcr.io/owen282000/charts/life-dashboard:<version> -R owen282000/life-dashboard-stack
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REPOSITORY }}/life-dashboard
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Artifact Hub's repository metadata (the ID that makes it a verified publisher) lives
      # under the tag artifacthub.io of the chart's repository, with Artifact Hub's media types.
      # ORAS signs in with the Docker credentials of the login above.
      - name: Push charts/artifacthub-repo.yml for Artifact Hub
        working-directory: charts
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oras.tar.gz" \
            "https://github.com/oras-project/oras/releases/download/v$ORAS_VERSION/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP" oras
          "$RUNNER_TEMP/oras" push "$REPOSITORY/life-dashboard:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

  # The registry pulls ghcr.io/owen282000/life-dashboard-mcp:<tag> anonymously and checks that
  # its label io.modelcontextprotocol.server.name is server.json's name, so this runs after the
  # images. GitHub OIDC proves the namespace io.github.owen282000: no secret. The release does
  # not wait for it; a failed publish can be run again on its own.
  mcp-registry:
    name: Publish to the MCP Registry
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      REGISTRY: https://registry.modelcontextprotocol.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Publish server.json
        run: |
          name=$(jq -r .name server.json)
          if curl -fsL -o /dev/null "$REGISTRY/v0.1/servers/${name/\//%2F}/versions/$TAG"; then
            echo "::notice::$name $TAG is already in the MCP Registry"
            exit 0
          fi
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

  release:
    name: Create the release
    needs: [images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub renames release assets that start with a dot, so .env.example goes up as
      # env.example.
      # install.sh fetches the other two of its own version, so the one-line install through
      # releases/latest/download/install.sh always gets three files of one release.
      - name: Create the release with docker-compose.yml, env.example and install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh "$TAG" > notes.md
          cp .env.example env.example
          gh release create "$TAG" docker-compose.yml env.example install.sh \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --notes-file notes.md
