name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - run: pip install -r receiver/requirements-dev.txt
      # The tests start their own Postgres container from the image in db/Dockerfile.
      - run: python -m pytest -q receiver/tests
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet

  # Every image for both architectures, without pushing, so a broken Dockerfile fails here
  # and not on the release tag.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [receiver, grafana, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The whole stack built from this commit, with the sample data: the receiver answers,
  # Grafana provisions all six dashboards and grafana_ro can read the dash views.
  stack:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
      COMPOSE_PROFILES: demo
      WEBHOOK_SECRET: ci-secret
      GRAFANA_DB_PASSWORD: ci-ro
      GRAFANA_PASSWORD: ci-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build --wait db receiver grafana
      - name: Load the sample data
        run: docker compose run --rm demo
      - name: Check the receiver, Grafana and grafana_ro
        run: |
          curl -fsS http://127.0.0.1:8080/health
          for _ in $(seq 1 30); do
            n=$(curl -fsS -u admin:ci-admin 'http://127.0.0.1:3000/api/search?type=dash-db' | jq length) && [ "$n" = 6 ] && break
            sleep 2
          done
          echo "dashboards: $n"
          [ "$n" = 6 ]
          docker compose exec -T -e PGPASSWORD=ci-ro db psql -h 127.0.0.1 -U grafana_ro -d lifedash -v ON_ERROR_STOP=1 -XAt \
            -c "SELECT count(*) FROM dash.activity_days" -c "SELECT count(*) FROM dash.screen_apps"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
