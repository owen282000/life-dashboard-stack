name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
      - run: pip install -r receiver/requirements-dev.txt -r mcp/requirements-dev.txt
      # The tests start their own Postgres container from the image in db/Dockerfile.
      - run: python -m pytest -q receiver/tests
      - run: python -m pytest -q mcp/tests
      - run: docker compose --profile demo --profile mcp config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.build.yml --profile demo --profile mcp config --quiet

  # Every image for both architectures, without pushing, so a broken Dockerfile fails here
  # and not on the release tag.
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [receiver, grafana, db, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The whole stack built from this commit, with the sample data: the receiver answers,
  # Grafana provisions all six dashboards, grafana_ro can read the dash views, and the API
  # and the MCP server answer with their tokens and refuse without them.
  stack:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
      COMPOSE_PROFILES: demo,mcp
      WEBHOOK_SECRET: ci-secret
      API_TOKEN: ci-api-token-0123456789
      MCP_TOKEN: ci-mcp-token-0123456789
      GRAFANA_DB_PASSWORD: ci-ro
      GRAFANA_PASSWORD: ci-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build --wait db receiver grafana mcp
      - name: Load the sample data
        run: docker compose run --rm demo
      - name: Check the receiver, Grafana and grafana_ro
        run: |
          curl -fsS http://127.0.0.1:8080/health
          for _ in $(seq 1 30); do
            n=$(curl -fsS -u admin:ci-admin 'http://127.0.0.1:3000/api/search?type=dash-db' | jq length) && [ "$n" = 6 ] && break
            sleep 2
          done
          echo "dashboards: $n"
          [ "$n" = 6 ]
          docker compose exec -T -e PGPASSWORD=ci-ro db psql -h 127.0.0.1 -U grafana_ro -d lifedash -v ON_ERROR_STOP=1 -XAt \
            -c "SELECT count(*) FROM dash.activity_days" -c "SELECT count(*) FROM dash.screen_apps"
      - name: Check the API and the MCP server
        run: |
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/phones)" = 401 ]
          curl -fsS -H "Authorization: Bearer $API_TOKEN" http://127.0.0.1:8080/api/phones | jq -e '.phones | length == 2'
          curl -fsS http://127.0.0.1:8090/health
          list='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d "$list" http://127.0.0.1:8090/mcp)" = 401 ]
          curl -fsS -X POST -H "Authorization: Bearer $MCP_TOKEN" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -d "$list" http://127.0.0.1:8090/mcp | grep -q daily_summary
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # The Helm chart with Helm 4 and Helm 3: lint and render every value file in ci/, validate
  # the result against the Kubernetes schemas and those of the CloudNativePG, Barman Cloud and
  # Gateway API resources, and check that the chart's Grafana data source matches the image's.
  chart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm: [v4.3.0, v3.22.0]
    env:
      CHART: charts/life-dashboard
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm }}
      - name: Install kubeconform
        run: |
          curl -fsSLo kubeconform.tar.gz "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tar.gz" | sha256sum -c
          tar -xzf kubeconform.tar.gz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Lint and render every value file
        run: |
          helm lint --strict "$CHART"
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::$values"
            helm lint --strict "$CHART" -f "$values"
            helm template ci "$CHART" -f "$values" > rendered.yaml
            kubeconform -strict -summary -kubernetes-version 1.34.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              rendered.yaml
            echo "::endgroup::"
          done
      - name: The schema refuses a typo and a missing external database
        run: |
          if helm template ci "$CHART" --set receiver.replica=2 > /dev/null 2>&1; then echo "a typo passed"; exit 1; fi
          if helm template ci "$CHART" --set postgres.mode=external > /dev/null 2>&1; then echo "external without a database passed"; exit 1; fi
      - name: The chart's data source is the image's, pointed at another host
        run: |
          helm template ci "$CHART" | yq 'select(.kind == "ConfigMap" and .metadata.name == "ci-life-dashboard-grafana-datasource") | .data["postgres.yml"]' \
            | yq 'del(.datasources[].url, .datasources[].jsonData.sslmode)' > chart.yml
          yq 'del(.datasources[].url, .datasources[].jsonData.sslmode)' grafana/provisioning/datasources/postgres.yml > image.yml
          diff image.yml chart.yml

  # The chart installed in kind with the images built from this commit: CloudNativePG with the
  # demo, the API and the MCP server, then the bundled Postgres with NetworkPolicies, each
  # followed by helm test, an upgrade that must keep the generated secrets, and helm test again.
  kind:
    runs-on: ubuntu-latest
    env:
      CHART: charts/life-dashboard
      CNPG_VERSION: 1.30.1
      TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: life-dashboard
      - name: Build the images and load them into kind
        run: |
          for image in receiver grafana mcp db; do
            docker build -q -f "$image/Dockerfile" -t "ghcr.io/owen282000/life-dashboard-$image:$TAG" .
            kind load docker-image --name life-dashboard "ghcr.io/owen282000/life-dashboard-$image:$TAG"
          done
      - name: Install CloudNativePG
        run: |
          kubectl apply --server-side -f "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v$CNPG_VERSION/cnpg-$CNPG_VERSION.yaml"
          kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=300s
      - name: CloudNativePG, with the demo, the API and the MCP server
        run: |
          kubectl create namespace cnpg
          kubectl label namespace cnpg pod-security.kubernetes.io/enforce=restricted
          helm install lifedash "$CHART" -n cnpg -f "$CHART/ci/cnpg-values.yaml" --set image.tag="$TAG" --wait --timeout 15m
          helm test lifedash -n cnpg --logs
          kubectl -n cnpg logs deployment/lifedash-life-dashboard-receiver | grep -q "grafana_ro is managed outside the receiver"
      - name: The bundled Postgres, with NetworkPolicies
        run: |
          kubectl create namespace bundled
          kubectl label namespace bundled pod-security.kubernetes.io/enforce=restricted
          helm install lifedash "$CHART" -n bundled -f "$CHART/ci/bundled-values.yaml" --set image.tag="$TAG" --wait --timeout 15m
          helm test lifedash -n bundled --logs
      - name: An upgrade keeps the generated secrets
        run: |
          for ns in cnpg bundled; do
            before=$(kubectl -n "$ns" get secret -l app.kubernetes.io/component=secrets -o json | jq -S '[.items[] | {(.metadata.name): .data}]')
            helm upgrade lifedash "$CHART" -n "$ns" -f "$CHART/ci/$ns-values.yaml" --set image.tag="$TAG" \
              --set timezone=Europe/Amsterdam --wait --timeout 15m
            after=$(kubectl -n "$ns" get secret -l app.kubernetes.io/component=secrets -o json | jq -S '[.items[] | {(.metadata.name): .data}]')
            [ "$before" = "$after" ] || { echo "$ns: the generated secrets changed on upgrade"; exit 1; }
            helm test lifedash -n "$ns" --logs
          done
      - if: failure()
        run: |
          kubectl get pods,clusters.postgresql.cnpg.io -A
          for ns in cnpg bundled; do
            kubectl -n "$ns" describe pods || true
            for d in receiver grafana mcp; do kubectl -n "$ns" logs "deployment/lifedash-life-dashboard-$d" --tail=100 || true; done
          done
