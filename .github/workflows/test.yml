name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The versions of the tools. Dependabot does not see these, so they are pinned by hand and
# checked before each release; the images go by tag and digest.
env:
  HELM_VERSION: v4.3.0
  HELM3_VERSION: v3.22.0
  CT_VERSION: 3.14.0
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
  CALICO_VERSION: v3.32.2
  CNPG_VERSION: 1.30.1
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d
  ALPINE_IMAGE: alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  PODMAN_COMPOSE_VERSION: 1.6.0

jobs:
  # The workflows, the shell scripts and every way to read the compose files.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint, with shellcheck on the run steps
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: shellcheck on the scripts and the pre-push hook
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" scripts/*.sh tools/*.sh .github/scripts/*.sh .githooks/pre-push install.sh
          # install.sh promises plain POSIX sh, so dash's rules too.
          docker run --rm -v "$PWD:/mnt" -w /mnt "$SHELLCHECK_IMAGE" --shell=dash install.sh
      - name: docker compose config, with and without the build override and the profiles
        run: |
          for files in "-f docker-compose.yml" "-f docker-compose.yml -f docker-compose.build.yml"; do
            for profiles in "" "--profile demo" "--profile mcp" "--profile demo --profile mcp"; do
              echo "docker compose $files $profiles config"
              # shellcheck disable=SC2086 # the flags are meant to split
              docker compose $files $profiles config --quiet
            done
          done

  # scripts/prepare-release.sh in a throwaway clone, then the release workflow's own check on the
  # result: the changelog, the compose file, install.sh, the chart, server.json and the MCP
  # server's version all move to the next version together.
  release-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: prepare-release.sh and the release check agree
        run: |
          current=$(grep -o 'LIFEDASH_VERSION:-[0-9.]*' docker-compose.yml | head -n 1 | cut -d- -f2)
          next=$(echo "$current" | awk -F. '{ print $1 "." $2 + 1 ".0" }')
          dir="$RUNNER_TEMP/release"
          git clone --quiet "$GITHUB_WORKSPACE" "$dir"
          cd "$dir"
          # Right after a release the Unreleased section is empty, and the release check rightly
          # refuses an empty section, so the dry run gets an entry of its own.
          if ! awk '/^## \[Unreleased\]/ { f = 1; next } /^## \[/ { exit } f && /[^[:space:]]/ { found = 1 } END { exit !found }' CHANGELOG.md; then
            sed -i 's/^## \[Unreleased\]$/## [Unreleased]\n\n### Fixed\n\n- A dry run of the release./' CHANGELOG.md
          fi
          echo "::group::scripts/prepare-release.sh $next"
          scripts/prepare-release.sh "$next"
          git diff --stat
          echo "::endgroup::"
          [ "$(git diff --name-only | sort | tr '\n' ' ')" = "CHANGELOG.md charts/life-dashboard/Chart.yaml docker-compose.yml install.sh mcp/server.py server.json " ] \
            || { echo "::error::prepare-release.sh changed other files than the changelog, the compose file, install.sh, Chart.yaml, mcp/server.py and server.json"; exit 1; }
          grep -qx "VERSION=$next" install.sh
          grep -q "^## \[$next\] - $(date +%Y-%m-%d)$" CHANGELOG.md
          grep -q "^\[Unreleased\]: .*/compare/$next\.\.\.HEAD$" CHANGELOG.md
          grep -q "^\[$next\]: " CHANGELOG.md
          .github/scripts/check-release.sh "$next"
          helm lint --strict charts/life-dashboard
          # The chart's images default to the new version.
          tags=$(helm template ci charts/life-dashboard -f charts/life-dashboard/ci/bundled-values.yaml \
            | grep -o 'image: "\?ghcr.io/owen282000/life-dashboard-[a-z]*:[^"]*' | sed 's/.*://' | sort -u)
          echo "chart image tags: $tags"
          [ "$tags" = "$next" ]
          # Artifact Hub gets the version's changelog entries, and the MCP Registry the new
          # version of the server on the new image.
          yq -e '.annotations."artifacthub.io/changes" | from_yaml | length > 0' charts/life-dashboard/Chart.yaml
          jq -e --arg v "$next" '.version == $v and ([.packages[].identifier] == ["ghcr.io/owen282000/life-dashboard-mcp:" + $v])' server.json
          .github/scripts/release-notes.sh "$next"

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [receiver, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: "*/requirements*.txt"
      - run: pip install -r receiver/requirements-dev.txt -r mcp/requirements-dev.txt
      # The tests start their own Postgres container on the Postgres image of db/Dockerfile.
      # receiver/tests also holds the documentation checks, among them the one for long dashes.
      - run: python -m pytest -q ${{ matrix.suite }}/tests

  # Every image for both architectures, without pushing, so a broken Dockerfile fails here
  # and not on the release tag. Then Trivy on the amd64 image.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [receiver, grafana, db, mcp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # The amd64 image once more, from the cache, into Docker for Trivy. It lists the high and
      # critical vulnerabilities, and fails on a critical one that has a fix.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: life-dashboard-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: Trivy
        run: |
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --scanners vuln --no-progress --table-mode detailed "$@" "life-dashboard-${{ matrix.image }}:scan"
          }
          trivy --severity HIGH,CRITICAL
          trivy --skip-db-update --severity CRITICAL --ignore-unfixed --exit-code 1

  # The whole stack built from this commit, with the sample data: the receiver answers,
  # Grafana provisions all six dashboards, grafana_ro can read the dash views, and the API
  # and the MCP server answer with their tokens and refuse without them.
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.build.yml
      COMPOSE_PROFILES: demo,mcp
      WEBHOOK_SECRET: ci-secret
      API_TOKEN: ci-api-token-0123456789
      MCP_TOKEN: ci-mcp-token-0123456789
      GRAFANA_DB_PASSWORD: ci-ro
      GRAFANA_PASSWORD: ci-admin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose up -d --build --wait db receiver grafana mcp
      - name: Load the sample data
        run: docker compose run --rm demo
      - name: Check the receiver, Grafana and grafana_ro
        run: |
          curl -fsS http://127.0.0.1:8080/health
          for _ in $(seq 1 30); do
            n=$(curl -fsS -u admin:ci-admin 'http://127.0.0.1:3000/api/search?type=dash-db' | jq length) && [ "$n" = 6 ] && break
            sleep 2
          done
          echo "dashboards: $n"
          [ "$n" = 6 ]
          # The Grafana image keeps only the plugins the stack uses: every panel and data source
          # type in the dashboards must be there.
          for t in $(jq -r '[.. | objects | select(has("gridPos")) | .type | select(. != "row")] + [.. | objects | .datasource? | objects | .type] | .[]' \
              grafana/dashboards/life-dashboard/*.json | sort -u); do
            curl -fsS -o /dev/null -u admin:ci-admin "http://127.0.0.1:3000/api/plugins/$t/settings" || { echo "missing plugin: $t"; exit 1; }
          done
          docker compose exec -T -e PGPASSWORD=ci-ro db psql -h 127.0.0.1 -U grafana_ro -d lifedash -v ON_ERROR_STOP=1 -XAt \
            -c "SELECT count(*) FROM dash.activity_days" -c "SELECT count(*) FROM dash.screen_apps"
      - name: Check the API and the MCP server
        run: |
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/phones)" = 401 ]
          curl -fsS -H "Authorization: Bearer $API_TOKEN" http://127.0.0.1:8080/api/phones | jq -e '.phones | length == 2'
          curl -fsS http://127.0.0.1:8090/health
          list='{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d "$list" http://127.0.0.1:8090/mcp)" = 401 ]
          curl -fsS -X POST -H "Authorization: Bearer $MCP_TOKEN" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' -d "$list" http://127.0.0.1:8090/mcp | grep -q daily_summary
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # install.sh the way a new user runs it, without a terminal, against the images built from this
  # commit: with Docker, and with rootless Podman and podman-compose. Then the doctor must pass on
  # the essentials, a second run and --upgrade must keep .env, and a stopped receiver must make the
  # doctor fail. --env-only runs in a container that has no container engine at all.
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    env:
      LIFEDASH_ENGINE: ${{ matrix.engine }}
      LIFEDASH_VERSION: ci
      # podman compose would pick the runner's Docker Compose plugin first; test podman-compose.
      PODMAN_COMPOSE_PROVIDER: podman-compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the images
        run: |
          for image in receiver grafana db mcp; do
            docker build -q -f "$image/Dockerfile" -t "ghcr.io/owen282000/life-dashboard-$image:ci" .
          done
      - if: matrix.engine == 'podman'
        name: Rootless Podman with podman-compose, a systemd user session for the healthchecks, and the images
        run: |
          podman --version
          pipx install "podman-compose==$PODMAN_COMPOSE_VERSION"
          podman-compose version
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          for _ in $(seq 1 30); do [ -S "/run/user/$uid/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          for image in receiver grafana db mcp; do
            docker save "ghcr.io/owen282000/life-dashboard-$image:ci" | podman load -q
          done
      - name: install.sh, without a terminal
        run: timeout 900 sh install.sh --no-pull --with-api --with-mcp --dir "$RUNNER_TEMP/lifedash"
      - name: The doctor passes on the essentials
        run: |
          # Podman runs healthchecks from a timer and its DNS can lag right after a start, so the
          # stack gets up to two minutes to settle before the doctor's verdict counts.
          for _ in 1 2 3 4 5 6 7 8; do
            sh install.sh doctor --dir "$RUNNER_TEMP/lifedash" > doctor.txt || true
            if grep -q '^PASS  container mcp:' doctor.txt && ! grep -q '^FAIL' doctor.txt; then break; fi
            sleep 15
          done
          cat doctor.txt
          for check in "container db" "container receiver" "container grafana" "container mcp" "receiver port" \
                       "receiver from this machine" "Grafana" "Grafana login" "MCP server" WEBHOOK_SECRET PUBLIC_URL \
                       database migrations grafana_ro dash_ro "receiver /health" API; do
            grep -q "^PASS  $check:" doctor.txt || { echo "::error::doctor: $check did not pass"; exit 1; }
          done
          if grep -q '^FAIL' doctor.txt; then exit 1; fi
      - name: A second run and --upgrade keep .env
        run: |
          env_file="$RUNNER_TEMP/lifedash/.env"
          before=$(sha256sum "$env_file")
          sh install.sh --no-pull --dir "$RUNNER_TEMP/lifedash"
          sh install.sh --no-pull --upgrade --dir "$RUNNER_TEMP/lifedash"
          [ "$(sha256sum "$env_file")" = "$before" ]
          [ "$(stat -c %a "$env_file")" = 600 ]
      - name: A stopped receiver makes the doctor fail
        run: |
          "$LIFEDASH_ENGINE" stop "$("$LIFEDASH_ENGINE" ps -q --filter label=com.docker.compose.service=receiver)"
          if sh install.sh doctor --dir "$RUNNER_TEMP/lifedash" > doctor.txt; then
            cat doctor.txt
            echo "::error::the doctor passed with the receiver stopped"
            exit 1
          fi
          grep '^FAIL  container receiver:' doctor.txt
      - if: matrix.engine == 'docker'
        name: --env-only without a container engine, from a clone and through a pipe
        run: |
          docker run --rm -v "$PWD:/repo:ro" "$ALPINE_IMAGE" sh -c '
            set -e
            if command -v docker || command -v podman; then echo "::error::the --env-only check needs a container without an engine"; exit 1; fi
            sh /repo/install.sh --env-only --with-api --with-mcp --public-url http://192.168.1.10:8080 --tz Europe/Amsterdam > /tmp/env
            grep -Eq "^WEBHOOK_SECRET=[0-9a-f]{64}$" /tmp/env
            grep -Eq "^GRAFANA_PASSWORD=[0-9a-f]{32}$" /tmp/env
            grep -Eq "^API_TOKEN=[0-9a-f]{64}$" /tmp/env
            grep -Eq "^MCP_TOKEN=[0-9a-f]{64}$" /tmp/env
            [ "$(sed -n "s/^API_TOKEN=//p" /tmp/env)" != "$(sed -n "s/^MCP_TOKEN=//p" /tmp/env)" ]
            grep -qx "PUBLIC_URL=http://192.168.1.10:8080" /tmp/env
            grep -qx "COMPOSE_PROFILES=mcp" /tmp/env'
          # Through a pipe there is no clone, so it fetches env.example; here from a local folder.
          mkdir release && cp docker-compose.yml release/ && cp .env.example release/env.example
          LIFEDASH_DOWNLOAD="file://$PWD/release" sh -s -- --env-only --output "$RUNNER_TEMP/env" < install.sh 2> notes.txt
          grep -q '^# CHANGE ME: PUBLIC_URL' "$RUNNER_TEMP/env"
          grep -qx 'PUBLIC_URL=' "$RUNNER_TEMP/env"
          grep -q "release/docker-compose.yml" notes.txt
          [ "$(stat -c %a "$RUNNER_TEMP/env")" = 600 ]
          if sh install.sh --env-only --output "$RUNNER_TEMP/env" 2>/dev/null; then echo "::error::--output overwrote a file"; exit 1; fi
      - if: failure()
        run: cd "$RUNNER_TEMP/lifedash" && "$LIFEDASH_ENGINE" compose --profile mcp logs --tail 100
      - if: always()
        run: cd "$RUNNER_TEMP/lifedash" 2>/dev/null && "$LIFEDASH_ENGINE" compose --profile mcp down -v || true

  # The Helm chart with Helm 4 and Helm 3: lint and render every value file in ci/, validate
  # the result against the Kubernetes schemas and those of the CloudNativePG, Barman Cloud and
  # Gateway API resources, and check that the chart's Grafana data source matches the image's.
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        helm: [4, 3]
    env:
      CHART: charts/life-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ matrix.helm == 3 && env.HELM3_VERSION || env.HELM_VERSION }}
      - name: Lint and render every value file
        run: |
          helm version
          helm lint --strict "$CHART"
          mkdir -p rendered
          for values in "$CHART"/ci/*.yaml; do
            echo "::group::$values"
            helm lint --strict "$CHART" -f "$values"
            helm template ci "$CHART" -f "$values" > "rendered/$(basename "$values")"
            echo "::endgroup::"
          done
      - name: kubeconform, with the CRD schemas of the datreeio CRDs catalog
        run: |
          mkdir -p "$RUNNER_TEMP/kubeconform"
          docker run --rm -v "$PWD/rendered:/rendered:ro" -v "$RUNNER_TEMP/kubeconform:/cache" "$KUBECONFORM_IMAGE" \
            -strict -summary -cache /cache -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /rendered
      - name: The schema refuses a typo and a missing external database
        run: |
          if helm template ci "$CHART" --set receiver.replica=2 > /dev/null 2>&1; then echo "a typo passed"; exit 1; fi
          if helm template ci "$CHART" --set postgres.mode=external > /dev/null 2>&1; then echo "external without a database passed"; exit 1; fi
      - name: The chart's data source is the image's, pointed at another host
        run: |
          helm template ci "$CHART" | yq 'select(.kind == "ConfigMap" and .metadata.name == "ci-life-dashboard-grafana-datasource") | .data["postgres.yml"]' \
            | yq 'del(.datasources[].url, .datasources[].jsonData.sslmode)' > chart.yml
          yq 'del(.datasources[].url, .datasources[].jsonData.sslmode)' grafana/provisioning/datasources/postgres.yml > image.yml
          diff image.yml chart.yml
      # chart-testing once: Chart.yaml against its schema, yamllint on Chart.yaml and
      # values.yaml, and helm lint with every value file in ci/.
      - if: matrix.helm == 4
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: ${{ env.CT_VERSION }}
      - if: matrix.helm == 4
        run: ct lint --charts "$CHART" --validate-maintainers=false --check-version-increment=false

  # The chart installed in kind with the images built from this commit, once per Postgres mode,
  # on Calico so the NetworkPolicies are enforced. cnpg: CloudNativePG with the demo, the API,
  # the MCP server and the pairing page; bundled: the db image in a StatefulSet. Each runs
  # helm test, checks who can reach Postgres, then a no-op upgrade that must roll no pod and keep
  # the generated secrets, and an upgrade with a changed value that keeps them too.
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [cnpg, bundled]
    env:
      CHART: charts/life-dashboard
      TAG: ci
      NS: ${{ matrix.mode }}
      RELEASE: lifedash
      NAME: lifedash-life-dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          config: .github/kind.yaml
          cluster_name: life-dashboard
          # Without a network plugin the node is not Ready until Calico runs.
          wait: 0s
      - name: Install Calico
        run: |
          kubectl create -f "https://raw.githubusercontent.com/projectcalico/calico/$CALICO_VERSION/manifests/calico.yaml" > /dev/null
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Build the images and load them into kind
        run: |
          for image in receiver grafana mcp db; do
            docker build -q -f "$image/Dockerfile" -t "ghcr.io/owen282000/life-dashboard-$image:$TAG" .
            kind load docker-image --name life-dashboard "ghcr.io/owen282000/life-dashboard-$image:$TAG"
          done
      - if: matrix.mode == 'cnpg'
        name: Install CloudNativePG
        run: |
          kubectl apply --server-side -f "https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v$CNPG_VERSION/cnpg-$CNPG_VERSION.yaml" > /dev/null
          kubectl -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=300s
      - name: Install the chart under the restricted Pod Security level and run helm test
        run: |
          kubectl create namespace "$NS"
          kubectl label namespace "$NS" pod-security.kubernetes.io/enforce=restricted
          helm install "$RELEASE" "$CHART" -n "$NS" -f "$CHART/ci/$NS-values.yaml" --set image.tag="$TAG" --wait --timeout 15m
          helm test "$RELEASE" -n "$NS" --logs
      - if: matrix.mode == 'cnpg'
        name: The receiver uses CloudNativePG's roles, and pairing.py prints the code
        run: |
          kubectl -n "$NS" logs "deployment/$NAME-receiver" > receiver.log
          grep -q "grafana_ro is managed outside the receiver" receiver.log
          # Only the URL line: the block also holds the webhook secret.
          kubectl -n "$NS" exec "deployment/$NAME-receiver" -- python pairing.py pixel > pairing.txt
          grep -E 'Webhook URL: +http://lifedash\.test:8080/webhook/pixel$' pairing.txt
      - if: matrix.mode == 'cnpg'
        name: Only the stack and CloudNativePG reach the CloudNativePG instances
        run: |
          kubectl create namespace outsider
          primary=$(kubectl -n "$NS" get pod -l "cnpg.io/cluster=$NAME-postgres,cnpg.io/instanceRole=primary" -o jsonpath='{.items[0].status.podIP}')
          .github/scripts/kind-probe.sh outsider - \
            "blocked:$primary:5432" "blocked:$primary:8000" "blocked:$NAME-postgres-rw.$NS:5432" \
            "open:$NAME-receiver.$NS:8080"
          # The receiver's own connection works, through the policy: helm test passed, and the
          # Cluster is healthy, so the operator reaches the instance manager on 8000.
          kubectl -n "$NS" wait "clusters.postgresql.cnpg.io/$NAME-postgres" --for=condition=Ready --timeout=60s
      - if: matrix.mode == 'bundled'
        name: Only the stack and the extra peer (app=backup) reach the bundled Postgres
        run: |
          kubectl create namespace outsider
          pod=$(kubectl -n "$NS" get pod -l app.kubernetes.io/component=postgres -o jsonpath='{.items[0].status.podIP}')
          .github/scripts/kind-probe.sh outsider - \
            "blocked:$pod:5432" "blocked:$NAME-postgres.$NS:5432" "open:$NAME-receiver.$NS:8080"
          .github/scripts/kind-probe.sh "$NS" - "blocked:$NAME-postgres:5432"
          .github/scripts/kind-probe.sh "$NS" app=backup "open:$NAME-postgres:5432" "open:$pod:5432"
      - name: A no-op upgrade rolls no pod and keeps the generated secrets
        run: |
          state() {
            kubectl -n "$NS" get secret -l app.kubernetes.io/component=secrets -o json | jq -S '[.items[] | {(.metadata.name): .data}]' | sha256sum
            kubectl -n "$NS" get pods --field-selector=status.phase=Running -o name | sort
          }
          before=$(state)
          echo "$before" | grep '^pod/'
          helm upgrade "$RELEASE" "$CHART" -n "$NS" -f "$CHART/ci/$NS-values.yaml" --set image.tag="$TAG" --wait --timeout 15m
          after=$(state)
          if [ "$before" != "$after" ]; then
            echo "::error::$NS: the no-op upgrade rolled pods or changed the generated secrets"
            diff <(echo "$before") <(echo "$after") || true
            exit 1
          fi
      - name: An upgrade with a changed value keeps the generated secrets, and helm test passes
        run: |
          secrets() { kubectl -n "$NS" get secret -l app.kubernetes.io/component=secrets -o json | jq -S '[.items[] | {(.metadata.name): .data}]' | sha256sum; }
          receiver() { kubectl -n "$NS" get pods -l app.kubernetes.io/component=receiver --field-selector=status.phase=Running -o name; }
          before=$(secrets) old=$(receiver)
          helm upgrade "$RELEASE" "$CHART" -n "$NS" -f "$CHART/ci/$NS-values.yaml" --set image.tag="$TAG" \
            --set-string receiver.podAnnotations.ci-upgrade=2 --wait --timeout 15m
          [ "$(secrets)" = "$before" ] || { echo "::error::$NS: the generated secrets changed on upgrade"; exit 1; }
          [ "$(receiver)" != "$old" ] || { echo "::error::$NS: the changed value did not roll the receiver"; exit 1; }
          helm test "$RELEASE" -n "$NS" --logs
      - if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get clusters.postgresql.cnpg.io,networkpolicies -A || true
          kubectl -n "$NS" describe pods || true
          for d in receiver grafana mcp; do kubectl -n "$NS" logs "deployment/$NAME-$d" --tail=100 || true; done
