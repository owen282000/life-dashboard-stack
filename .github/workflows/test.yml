name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.8"
      - run: pip install -r receiver/requirements-dev.txt
      # The tests start their own Postgres container from the image in docker-compose.yml.
      - run: python -m pytest -q receiver/tests
      - run: docker compose config --quiet
