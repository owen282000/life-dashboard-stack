# The kind cluster of the test workflow's kind job. It installs Calico instead of kind's own
# kindnet, so the NetworkPolicies are enforced by a plugin that real clusters run too, on
# Calico's default pod network.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
