# Life Dashboard Stack: receiver, Postgres and Grafana.
# Settings come from .env (see .env.example). This file is all you need: the images
# are published on ghcr.io for amd64 and arm64.
#   Start:         docker compose up -d
#   Upgrade:       set LIFEDASH_VERSION in .env, then docker compose pull && docker compose up -d
#   Sample data:   docker compose --profile demo up -d
#   MCP server:    docker compose --profile mcp up -d (docs/mcp.md)
#   From source:   docker-compose.build.yml in the repository builds the images instead

services:
  db:
    image: ghcr.io/owen282000/life-dashboard-db:${LIFEDASH_VERSION:-1.2.0}
    # The image's entrypoint refuses to start while an old Postgres 16 volume still holds
    # the data.
    environment:
      POSTGRES_USER: lifedash
      POSTGRES_PASSWORD: lifedash
      POSTGRES_DB: lifedash
      IGNORE_OLD_VOLUME: ${IGNORE_OLD_VOLUME:-0}
    volumes:
      - pgdata:/var/lib/postgresql
      # The Postgres 16 volume of earlier versions, read-only, for the guard and the upgrade.
      - db-data:/old:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U lifedash -d lifedash"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  receiver:
    image: ghcr.io/owen282000/life-dashboard-receiver:${LIFEDASH_VERSION:-1.2.0}
    environment:
      DATABASE_URL: postgresql://lifedash:lifedash@db:5432/lifedash
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      # A new install refuses to start without WEBHOOK_SECRET unless this is 1. .env.example
      ALLOW_UNSIGNED: ${ALLOW_UNSIGNED:-0}
      TZ: ${TZ:-UTC}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-lifedash-ro}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PAIRING_LOG: ${PAIRING_LOG:-1}
      PAIRING_PAGE: ${PAIRING_PAGE:-1}
      PAIRING_TOKEN: ${PAIRING_TOKEN:-}
      # The read-only API under /api/ is off while API_TOKEN is empty. docs/api.md
      API_TOKEN: ${API_TOKEN:-}
      DASH_DB_PASSWORD: ${DASH_DB_PASSWORD:-lifedash-dash-ro}
    ports:
      - "${RECEIVER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    # No spaces in the Python line: Podman's Docker API splits a healthcheck's arguments on them.
    healthcheck:
      test: ["CMD", "python", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:8080/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 30
    restart: unless-stopped

  grafana:
    image: ghcr.io/owen282000/life-dashboard-grafana:${LIFEDASH_VERSION:-1.2.0}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-lifedash}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-lifedash-ro}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/life-dashboard/overview.json
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: ${TZ:-UTC}
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Keep the plugins that ship in the pinned image. Otherwise Grafana downloads newer
      # ones on the first start, the Postgres data source included, which drops out for a
      # second while it is replaced.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      receiver:
        condition: service_healthy
    restart: unless-stopped

  # Sample data for two phones (demo-android and demo-iphone). Only with --profile demo.
  demo:
    profiles: ["demo"]
    image: ghcr.io/owen282000/life-dashboard-receiver:${LIFEDASH_VERSION:-1.2.0}
    command: ["python", "tools/sample_data.py"]
    environment:
      URL: http://receiver:8080
      SECRET: ${WEBHOOK_SECRET:-}
      TZ: ${TZ:-UTC}
    depends_on:
      receiver:
        condition: service_healthy
    restart: "no"

  # Read-only MCP server for a model of your choice. Only with --profile mcp. docs/mcp.md
  mcp:
    profiles: ["mcp"]
    image: ghcr.io/owen282000/life-dashboard-mcp:${LIFEDASH_VERSION:-1.2.0}
    init: true
    environment:
      MCP_TOKEN: ${MCP_TOKEN:-}
      PGHOST: db
      PGDATABASE: lifedash
      PGUSER: dash_ro
      PGPASSWORD: ${DASH_DB_PASSWORD:-lifedash-dash-ro}
    ports:
      - "${MCP_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "__import__('urllib.request').request.urlopen('http://127.0.0.1:8090/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10
    depends_on:
      receiver:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  db-data:
  grafana-data:
